api_version: cuac/v1
kind: relation
id: typed_segments
schema: static

columns:
  - id: value
    type: VARCHAR
    nullable: false
    extract: $.value

inputs:
  - id: enabled
    type: BOOLEAN
    nullable: false
  - id: count
    type: BIGINT
    nullable: false
  - id: label
    type: VARCHAR
    nullable: false
    default: {kind: value, value: "default value"}
  - id: ratio
    type: DOUBLE
    nullable: false

auth:
  mode: anonymous

resources:
  max_response_bytes_per_page: 4096
  max_response_bytes_per_scan: 4096
  max_records_per_page: 1
  max_records_per_scan: 1
  max_extracted_string_bytes: 1024

operations:
  - id: get_typed_segments
    when:
      required_inputs: [input.enabled, input.count, input.label, input.ratio]
    cardinality: one
    replay_safety: safe
    request:
      protocol: rest
      method: GET
      origin:
        scheme: https
        host: gitlab.com
        port: 443
      path_segments:
        - {literal: typed}
        - {input: enabled, encoding: rfc3986_percent_encoded}
        - {input: count, encoding: rfc3986_percent_encoded}
        - {input: label, encoding: rfc3986_percent_encoded}
        - {input: ratio, encoding: rfc3986_percent_encoded}
      query: []
      headers:
        - name: Accept
          value: application/json
    response:
      source: root_object
    pagination:
      strategy: disabled
