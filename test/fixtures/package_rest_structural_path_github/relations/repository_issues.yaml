api_version: cuac/v1
kind: relation
id: repository_issues
schema: static

columns:
  - id: number
    type: BIGINT
    nullable: false
    extract: $.number
  - id: title
    type: VARCHAR
    nullable: false
    extract: $.title

inputs:
  - id: owner
    type: VARCHAR
    nullable: false
  - id: repository
    type: VARCHAR
    nullable: false

auth:
  mode: anonymous

resources:
  max_response_bytes_per_page: 1048576
  max_response_bytes_per_scan: 1048576
  max_records_per_page: 100
  max_records_per_scan: 100
  max_extracted_string_bytes: 1024

operations:
  - id: list_repository_issues
    when:
      required_inputs: [input.owner, input.repository]
    cardinality: many
    replay_safety: safe
    request:
      protocol: rest
      method: GET
      origin:
        scheme: https
        host: api.github.com
        port: 443
      path_segments:
        - {literal: repos}
        - {input: owner, encoding: rfc3986_percent_encoded}
        - {input: repository, encoding: rfc3986_percent_encoded}
        - {literal: issues}
      query: []
      headers:
        - name: Accept
          value: application/vnd.github+json
        - name: User-Agent
          value: cuac
    response:
      source: root_array
    pagination:
      strategy: disabled
