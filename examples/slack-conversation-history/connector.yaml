api_version: cuac/v1
kind: connector
id: slack
version: 1.0.0
extractor_dialect: cuac/json_path_v1

credentials:
  - id: slack_token
    kind: bearer
    secret_field: token
    placement: authorization_header
    destinations:
      - scheme: https
        host: slack.com
        port: 443

network_policy:
  origins:
    - scheme: https
      host: slack.com
      port: 443
  redirects: deny
  private_addresses: deny
  link_local_addresses: deny
  loopback_addresses: deny
  max_response_bytes: 8388608

relations:
  - conversation_history
