api_version: cuac/v1
kind: connector
id: rickandmorty
version: 2.0.0
extractor_dialect: cuac/json_path_v1

network_policy:
  origins:
    - scheme: https
      host: rickandmortyapi.com
      port: 443
  redirects: deny
  private_addresses: deny
  link_local_addresses: deny
  loopback_addresses: deny
  max_response_bytes: 8388608

relations:
  - pilot_episode
  - character_search
